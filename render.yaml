services:
  - type: web
    name: terratrace-ai-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/data/terratrace.db
      - key: DATA_DIR
        value: /app/data
      - key: ARTIFACTS_DIR
        value: /app/data/artifacts
      - key: ALLOWED_ORIGINS
        value: '["https://terratrace-ai.vercel.app","http://localhost:5173"]'
      - key: EARTHDATA_USERNAME
        sync: false
      - key: EARTHDATA_PASSWORD
        sync: false
      - key: EARTHDATA_TOKEN
        sync: false
      - key: FIRMS_MAP_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: terratrace-artifacts
      - key: USE_SUPABASE_STORAGE
        value: "true"
      - key: DATABASE_URL
        sync: false
    disk:
      name: terratrace-data
      mountPath: /app/data
      sizeGB: 1